name: Bug Report
description: Report a bug in Okaiwa
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. **Do NOT report security vulnerabilities here** — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: "e.g. iOS 18.2 / Android 15"
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 16 Pro / Pixel 9"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (never include private keys or message content).
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots.
