version: 2

updates:
  # npm — relay service
  - package-ecosystem: "npm"
    directory: "/relay"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # npm — identity service
  - package-ecosystem: "npm"
    directory: "/identity"
    target-branch: "dev"
