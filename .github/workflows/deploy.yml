name: Deploy

on:
  push:
    branches: [rec, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      relay: ${{ steps.changes.outputs.relay }}
      identity: ${{ steps.changes.outputs.identity }}
      push: ${{ steps.changes.outputs.push }}
      blockchain: ${{ steps.changes.outputs.blockchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relay:
              - 'relay/**'
            identity:
              - 'identity/**'
            push:
              - 'push/**'
            blockchain:
              - 'blockchain/**'

  deploy-relay:
    name: Deploy Relay
    needs: detect-changes
    if: needs.detect-changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build relay
        run: pnpm --filter @okaiwa/relay build
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_RELAY }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: relay

  deploy-identity:
    name: Deploy Identity
    needs: detect-changes
    if: needs.detect-changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build identity
        run: pnpm --filter @okaiwa/identity build
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_IDENTITY }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: identity
      - name: Run migrations
        run: |
          heroku run --app ${{ secrets.HEROKU_APP_IDENTITY }} node ace migration:run --force

  deploy-push:
    name: Deploy Push
    needs: detect-changes
    if: needs.detect-changes.outputs.push == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build push
        run: pnpm --filter @okaiwa/push build
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_PUSH }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: push

  deploy-blockchain:
    name: Deploy Blockchain
    needs: detect-changes
    if: needs.detect-changes.outputs.blockchain == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build blockchain
        run: pnpm --filter @okaiwa/blockchain build
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_BLOCKCHAIN }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: blockchain
